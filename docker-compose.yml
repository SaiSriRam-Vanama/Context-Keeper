version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    container_name: context-keeper-ollama
    restart: unless-stopped
    command: serve

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=phi3:mini
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_data
      - repos_data:/app/repos
    depends_on:
      - ollama
    container_name: context-keeper-backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    container_name: context-keeper-frontend
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:
  repos_data:
